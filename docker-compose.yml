services:
  postgres:
    image: postgres:16-alpine
    container_name: pact-postgres
    environment:
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
      POSTGRES_DB: pact_broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pact-pgdata:/var/lib/postgresql/data

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pact-broker
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker@postgres:5432/pact_broker
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pact-pgdata:
